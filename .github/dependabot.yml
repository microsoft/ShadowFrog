version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # CodeQL stages share versioned configuration and must move together.
      codeql:
        patterns:
          - "github/codeql-action/*"
    cooldown:
      default-days: 7
